<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erika & Franz · Nos casamos a bordo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E2A4F;--slate:#4F5561;--sky:#B1C4DB;--ivory:#F0EDE5;--sand:#E5D5C2;--dash:#66758A;--white:#FFFFFF}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--navy);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;line-height:1.55}
img{max-width:100%}
a{color:var(--navy)}
.script{font-family:'Pinyon Script',cursive;font-weight:400}
.caps{font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.28em;text-transform:uppercase}
.muted{color:var(--slate)}
.flags{display:flex;flex-direction:column}
.flags span{display:block;height:5px}
.wrap{max-width:880px;margin:0 auto;padding:0 22px}
header.top{position:sticky;top:0;z-index:5;background:var(--navy);color:var(--ivory)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 22px;max-width:1100px;margin:0 auto}
.topbar nav{display:flex;gap:18px;flex-wrap:wrap}
.topbar nav a{color:var(--ivory);text-decoration:none;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.topbar nav a:hover{color:var(--sky)}
.langs{display:flex;gap:4px}
.langs button{font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.15em;background:transparent;color:var(--ivory);border:1px solid transparent;border-radius:20px;padding:6px 10px;cursor:pointer;min-height:36px}
.langs button[aria-pressed="true"]{border-color:var(--ivory)}
@media (max-width:720px){.topbar nav{display:none}}
.hero{text-align:center;padding:64px 22px 56px;position:relative}
.hero .mono{width:150px}
.hero h1{margin:6px 0 0;font-size:clamp(56px,11vw,96px);line-height:1}
.hero .tag{font-size:22px;font-style:italic;margin:6px 0 18px}
.route{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.route .dot{width:5px;height:5px;border-radius:50%;background:var(--navy)}
.count{display:inline-flex;gap:22px;flex-wrap:wrap;justify-content:center;margin-top:30px;padding:16px 28px;border-top:1.5px dashed var(--dash);border-bottom:1.5px dashed var(--dash)}
.count div{display:flex;flex-direction:column;align-items:center}
.count b{min-width:2ch;font-size:40px;font-weight:500;line-height:1}

section{padding:70px 0}
.sec-head{text-align:center;margin-bottom:34px}
.sec-head img{height:56px}
.sec-head h2{margin:6px 0 2px;font-family:'Pinyon Script',cursive;font-weight:400;font-size:52px;line-height:1.1}
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:36px;align-items:center}
.story img{width:100%;max-width:260px;justify-self:center}
.story p{margin:0 0 12px;font-size:20px}
@media (max-width:640px){.story{grid-template-columns:1fr}}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:26px}
.tabs button{background:var(--white);border:1.5px solid var(--navy);border-radius:10px;padding:12px 6px;cursor:pointer;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;font-family:inherit}
.tabs button b{font-size:30px;font-weight:500;line-height:1}
.tabs button[aria-selected="true"]{background:var(--navy);color:var(--ivory)}
.day{background:var(--white);border:1.5px solid var(--navy);border-radius:14px;overflow:hidden}
.day-head{background:var(--navy);color:var(--ivory);padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.day-head h3{margin:0;font-family:'Pinyon Script',cursive;font-weight:400;font-size:44px;line-height:1}
.day-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0}
@media (max-width:720px){.day-body{grid-template-columns:1fr}}
.col{padding:24px 26px}
.col+.col{border-left:1.5px dashed var(--dash)}
@media (max-width:720px){.col+.col{border-left:0;border-top:1.5px dashed var(--dash)}}
.col h4{margin:0 0 12px}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.plan li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px}
.plan .t{font-family:'Montserrat',sans-serif;font-size:13px;padding-top:4px}
.plan .e{font-size:19px;font-weight:500;line-height:1.3}
.plan .d{font-size:15px;font-style:italic;color:var(--slate)}
.sleep{display:flex;gap:12px;align-items:center;margin-top:22px;padding-top:18px;border-top:1.5px dashed var(--dash)}
.sleep img{height:38px}
.menu-list{display:flex;flex-direction:column;gap:12px}
.menu-list .k{font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate)}
.menu-list .v{font-size:19px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--ivory);background:var(--navy);border:1.5px solid var(--navy);padding:12px 18px;border-radius:30px;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--navy)}
.msgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.msg{background:var(--white);border:1.5px solid var(--navy);border-radius:120px 120px 10px 10px;padding:46px 26px 24px;text-align:center}
.msg p{margin:8px 0 10px;font-size:19px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.album{background:var(--white);border:1.5px solid var(--navy);border-radius:12px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qr{width:150px;height:150px;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--navy);background:var(--white)}
.qr svg{width:136px;height:136px;display:block}
.qr .ph{font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.15em;color:var(--slate);padding:10px}
.note{max-width:620px;margin:22px auto 0;text-align:center;font-style:italic;color:var(--slate)}
details{background:var(--white);border:1.5px solid var(--navy);border-radius:10px;margin-bottom:10px}
summary{cursor:pointer;padding:16px 20px;font-size:20px;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';font-family:'Montserrat',sans-serif}
details[open] summary::after{content:'−'}
details p{margin:0;padding:0 20px 18px;font-size:18px}
footer{background:var(--navy);color:var(--ivory);text-align:center;padding:46px 22px 30px}
footer img{height:90px}
@media (max-width:520px){.tabs{gap:6px}.tabs button{padding:10px 2px}.tabs button .caps{font-size:11px;letter-spacing:.03em}.tabs button b{font-size:26px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.album{padding:14px 10px}.qr{width:120px;height:120px}.qr svg{width:108px;height:108px}.album .btn{padding:10px 12px;letter-spacing:.08em}}
.crew{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:30px;align-items:center}
@media (max-width:760px){.crew{grid-template-columns:1fr}}
.crew svg{width:100%;height:auto;display:block}
.km{text-align:center;padding:18px 10px;border-top:1.5px dashed var(--dash);border-bottom:1.5px dashed var(--dash);margin-bottom:18px}
.km b{display:block;font-size:46px;font-weight:500;line-height:1}
.cities{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:8px}
.cities li{display:flex;justify-content:space-between;gap:10px;font-size:18px;border-bottom:1px solid var(--sand);padding-bottom:6px}
.travel{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--white);border:1.5px solid var(--navy);border-radius:12px;padding:16px}
.travel .qr{width:140px;height:140px;flex:none}.travel .qr svg{width:128px;height:128px}.travel>div:last-child{flex:1 1 200px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

function geo(lat1,lon1,lat2,lon2){
 var R=6371,toR=Math.PI/180,p1=lat1*toR,p2=lat2*toR,dl=(lon2-lon1)*toR,dp=(lat2-lat1)*toR;
 var a=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
 var d=2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
 var b=Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl));
 return {d:d,b:b};
}

 h+='<circle r="30" fill="#1E2A4F"/><text y="5" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#F0EDE5">BCN</text></svg>';
 document.getElementById("rose").innerHTML=h+'<span id="rose-desc" class="sr-only">'+esc(t("crew_alt"))+'</span>';
 document.getElementById("km-total").textContent=Math.round(total).toLocaleString(lang==="en"?"en-GB":lang==="de"?"de-DE":"es-ES");
 document.getElementById("cities").innerHTML=CREW.slice().sort(function(a,b){return b._d-a._d;}).map(function(c){
  return '<li><span>'+esc(c.city)+'</span><span class="muted">'+(c.guests||1)+' '+esc(t("guests_n"))+' · '+Math.round(c._d).toLocaleString("es-ES")+' km</span></li>'; }).join("");
 document.getElementById("form-btn").innerHTML = FORM_URL ? '<a class="btn" href="'+esc(FORM_URL)+'" target="_blank" rel="noopener">'+esc(t("form_btn"))+'</a>' : '';
 document.getElementById("qr-travel").innerHTML = (TRAVEL_FOLDER && QR_SVG.travel) ? QR_SVG.travel : '<span class="ph">'+esc(t("qr_pending"))+'</span>';
 document.getElementById("travel-btn").innerHTML = TRAVEL_FOLDER ? '<a class="btn" href="'+esc(TRAVEL_FOLDER)+'" target="_blank" rel="noopener">'+esc(t("open_album"))+'</a>' : '';
}
function renderFaq(){
 document.getElementById("faq").innerHTML = FAQ.map(function(f){ return '<details><summary>'+esc(f.q[lang])+'</summary><p>'+esc(f.a[lang])+'</p></details>'; }).join("");
}
function tick(){
 var start = new Date("2027-05-07T12:00:00+02:00").getTime(), end = new Date("2027-05-10T12:00:00+02:00").getTime(), now = Date.now();
 var box = document.getElementById("count"), msg = document.getElementById("cd-msg");
 if (now >= start) { box.style.display = "none"; msg.style.display = "block"; msg.textContent = t(now < end ? "cd_on" : "cd_after"); return; }
 var ms = start - now;
 document.getElementById("cd-days").textContent = Math.floor(ms/86400000);
 document.getElementById("cd-hours").textContent = Math.floor(ms/3600000)%24;
 document.getElementById("cd-min").textContent = Math.floor(ms/60000)%60;
 document.getElementById("cd-sec").textContent = Math.floor(ms/1000)%60;
}
function renderAll(){ renderStatic(); renderCrew(); renderTabs(); renderDay(); renderMsgs(); renderGallery(); renderFaq(); }

document.querySelectorAll(".langs button").forEach(function(b){
 b.addEventListener("click", function(){ lang = b.getAttribute("data-lang"); try{ localStorage.setItem("ef-lang", lang); }catch(e){} renderAll(); tick(); });
});
renderAll(); tick(); setInterval(tick, 1000);
</script>
